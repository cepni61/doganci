<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haberler - Doğancı Köyü Platformu</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="icons/favicon.ico">
    <meta name="theme-color" content="#e05a00">
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-S9Y0X0LK42"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-S9Y0X0LK42');
    </script>
</head>
<body>
    <a href="#main-content" class="skip-link">Ana içeriğe atla</a>

    <!-- Navbar -->
    <nav class="navbar" role="navigation" aria-label="Ana navigasyon">
        <div class="navbar-container">
            <a href="index.html" class="logo">
                <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <circle cx="50" cy="50" r="48" fill="#4E9FD1" stroke="#00CED1" stroke-width="3"/>
                    <path d="M30 60 L50 30 L70 60 Z" fill="#8B4513"/>
                    <path d="M45 40 L50 30 L55 40 Z" fill="#fff"/>
                    <polygon points="35,65 38,55 41,65" fill="#228B22"/>
                    <polygon points="42,65 45,55 48,65" fill="#228B22"/>
                    <polygon points="52,65 55,55 58,65" fill="#228B22"/>
                    <polygon points="59,65 62,55 65,65" fill="#228B22"/>
                    <ellipse cx="50" cy="75" rx="35" ry="8" fill="#90EE90"/>
                    <circle cx="50" cy="50" r="46" stroke="#fff" stroke-width="1.5" fill="none"/>
                </svg>
                <span>Doğancı Köyü Platformu</span>
            </a>
            <button class="hamburger" aria-label="Menüyü aç/kapa" aria-expanded="false" onclick="this.setAttribute('aria-expanded', this.getAttribute('aria-expanded')==='false');document.getElementById('navLinks').classList.toggle('open')">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="members.html">Üyeler</a></li>
                <li><a href="news.html" class="active">Haberler</a></li>
            </ul>
        </div>
    </nav>

    <main id="main-content">
        <div class="page-container">
            <div class="page-header">
                <h2>Haberler ve Duyurular</h2>
                <p>En son gelişmeler ve önemli duyurular</p>
            </div>

            <div class="news-filter-container">
                <div class="search-box">
                    <label for="newsSearchInput" class="sr-only">Haber ara</label>
                    <input type="text" id="newsSearchInput" class="search-input" placeholder="Haber ara...">
                </div>
                <div class="filter-box">
                    <label for="categoryFilter" class="sr-only">Kategoriye göre filtrele</label>
                    <select id="categoryFilter" class="filter-select">
                        <option value="">Tüm Kategoriler</option>
                    </select>
                </div>
                <div class="filter-box">
                    <label for="sortFilter" class="sr-only">Sıralama</label>
                    <select id="sortFilter" class="filter-select">
                        <option value="newest">En Yeni</option>
                        <option value="oldest">En Eski</option>
                    </select>
                </div>
                <div class="result-counter" aria-live="polite">
                    <span id="newsResultCount">0</span> haber
                </div>
            </div>

            <div id="loading" class="loading" role="status">Yükleniyor...</div>
            <div id="noNews" class="no-news" style="display: none;" role="status">
                <span aria-hidden="true">&#128240;</span>
                <p>Aradığınız kriterlere uygun haber bulunamadı.</p>
            </div>

            <div id="newsGrid" class="news-grid" style="display: none;"></div>

            <div id="newsPagination" class="pagination" style="display: none;" aria-label="Sayfa navigasyonu"></div>
        </div>

        <!-- Haber Detay Modalı -->
        <div id="newsDetail" class="news-detail-overlay" style="display:none;">
            <div class="news-detail-container">
                <div class="news-detail-header">
                    <button class="news-detail-back" onclick="closeNewsDetail()" aria-label="Geri dön">&#8592; Geri</button>
                </div>
                <div class="news-detail-body" id="newsDetailBody"></div>
                <div class="news-detail-footer">
                    <button class="btn btn-primary news-share-btn" onclick="shareNews()" aria-label="Haberi paylaş">&#128279; Haberi Paylaş</button>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <script src="js/supabase-config.js"></script>
    <script>
        const db = supabaseClient;

        // XSS korumasi
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        let allNews = [];
        let newsCurrentPage = 1;
        const newsPerPage = 15;
        let filteredNews = [];

        async function loadNews() {
            const loading = document.getElementById('loading');
            const noNews = document.getElementById('noNews');

            try {
                const { data: news, error } = await db
                    .from('news')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                allNews = news || [];
                loading.style.display = 'none';

                if (allNews.length === 0) {
                    noNews.style.display = 'block';
                    document.getElementById('newsResultCount').textContent = '0';
                    return;
                }

                // Kategori filtresi doldur
                const categories = [...new Set(allNews.map(n => n.category).filter(Boolean))].sort();
                const categoryFilter = document.getElementById('categoryFilter');
                categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat;
                    option.textContent = cat;
                    categoryFilter.appendChild(option);
                });

                filteredNews = allNews;
                displayNews(filteredNews);

            } catch (error) {
                console.error('Haberler yükleme hatası:', error);
                loading.textContent = 'Hata: ' + error.message;
            }
        }

        function renderNewsCard(item) {
            const title = escapeHtml(item.title);
            const author = escapeHtml(item.author);
            const category = escapeHtml(item.category);
            const imageUrl = item.image_url ? escapeHtml(item.image_url) : '';
            const content = escapeHtml(item.content);

            const date = new Date(item.created_at || item.published_at);
            const formattedDate = date.toLocaleDateString('tr-TR', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });

            const shortContent = content.length > 150
                ? content.substring(0, 150) + '...'
                : content;

            return `
                <article class="news-card" onclick="openNewsDetail('${item.id}')" style="cursor:pointer;" role="button" tabindex="0">
                    ${imageUrl
                        ? `<img src="${imageUrl}" class="news-image" alt="${title}" loading="lazy">`
                        : `<div class="news-image-placeholder" aria-hidden="true">&#128240;</div>`}
                    <div class="news-content">
                        ${category ? `<span class="news-category-badge">${category}</span>` : ''}
                        <h3>${title}</h3>
                        <div class="news-meta">
                            <span>${formattedDate}</span>
                            ${author ? `<span>${author}</span>` : ''}
                        </div>
                        ${shortContent ? `<p>${shortContent}</p>` : ''}
                    </div>
                </article>
            `;
        }

        function displayNews(news) {
            const grid = document.getElementById('newsGrid');
            const noNews = document.getElementById('noNews');
            const pagination = document.getElementById('newsPagination');
            document.getElementById('newsResultCount').textContent = news.length;

            if (news.length === 0) {
                grid.style.display = 'none';
                noNews.style.display = 'block';
                pagination.style.display = 'none';
                return;
            }

            noNews.style.display = 'none';

            const totalPages = Math.ceil(news.length / newsPerPage);
            if (newsCurrentPage > totalPages) newsCurrentPage = 1;

            const start = (newsCurrentPage - 1) * newsPerPage;
            const end = start + newsPerPage;
            const pageNews = news.slice(start, end);

            grid.style.display = 'grid';
            grid.innerHTML = pageNews.map(renderNewsCard).join('');

            // Pagination
            if (totalPages > 1) {
                let paginationHtml = '';
                paginationHtml += `<button class="page-btn ${newsCurrentPage === 1 ? 'disabled' : ''}" onclick="goToNewsPage(${newsCurrentPage - 1})" ${newsCurrentPage === 1 ? 'disabled' : ''} aria-label="Önceki sayfa">&laquo;</button>`;
                for (let i = 1; i <= totalPages; i++) {
                    paginationHtml += `<button class="page-btn ${i === newsCurrentPage ? 'active' : ''}" onclick="goToNewsPage(${i})" aria-label="Sayfa ${i}">${i}</button>`;
                }
                paginationHtml += `<button class="page-btn ${newsCurrentPage === totalPages ? 'disabled' : ''}" onclick="goToNewsPage(${newsCurrentPage + 1})" ${newsCurrentPage === totalPages ? 'disabled' : ''} aria-label="Sonraki sayfa">&raquo;</button>`;
                pagination.innerHTML = paginationHtml;
                pagination.style.display = 'flex';
            } else {
                pagination.style.display = 'none';
            }

            // GA4 haber görüntüleme takibi
            if (typeof gtag === 'function') {
                var observer = new IntersectionObserver(function(entries) {
                    entries.forEach(function(entry) {
                        if (entry.isIntersecting) {
                            var t = entry.target.querySelector('h3');
                            if (t) gtag('event', 'news_read', { news_title: t.textContent });
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.5 });
                document.querySelectorAll('.news-card').forEach(function(card) {
                    observer.observe(card);
                });
            }
        }

        function goToNewsPage(page) {
            const totalPages = Math.ceil(filteredNews.length / newsPerPage);
            if (page < 1 || page > totalPages) return;
            newsCurrentPage = page;
            displayNews(filteredNews);
            document.getElementById('newsGrid').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function filterNews() {
            const searchTerm = document.getElementById('newsSearchInput').value.toLowerCase();
            const categoryFilter = document.getElementById('categoryFilter').value;
            const sortFilter = document.getElementById('sortFilter').value;
            let filtered = allNews;

            if (searchTerm) {
                filtered = filtered.filter(n =>
                    n.title.toLowerCase().includes(searchTerm) ||
                    (n.content && n.content.toLowerCase().includes(searchTerm)) ||
                    (n.author && n.author.toLowerCase().includes(searchTerm)) ||
                    (n.category && n.category.toLowerCase().includes(searchTerm))
                );
            }

            if (categoryFilter) {
                filtered = filtered.filter(n => n.category === categoryFilter);
            }

            // Sıralama
            filtered = [...filtered].sort((a, b) => {
                const dateA = new Date(a.created_at || a.published_at);
                const dateB = new Date(b.created_at || b.published_at);
                return sortFilter === 'oldest' ? dateA - dateB : dateB - dateA;
            });

            newsCurrentPage = 1;
            filteredNews = filtered;
            displayNews(filteredNews);
        }

        document.getElementById('newsSearchInput').addEventListener('input', filterNews);
        document.getElementById('categoryFilter').addEventListener('change', filterNews);
        document.getElementById('sortFilter').addEventListener('change', filterNews);
        window.addEventListener('load', loadNews);

        // Haber Detay
        let currentNewsItem = null;

        function openNewsDetail(id) {
            const item = allNews.find(n => n.id === id);
            if (!item) return;
            currentNewsItem = item;

            const title = escapeHtml(item.title);
            const author = escapeHtml(item.author);
            const category = escapeHtml(item.category);
            const imageUrl = item.image_url ? escapeHtml(item.image_url) : '';
            const content = escapeHtml(item.content || '');

            const date = new Date(item.created_at || item.published_at);
            const formattedDate = date.toLocaleDateString('tr-TR', {
                day: 'numeric', month: 'long', year: 'numeric'
            });

            // Satır sonlarını <br> olarak göster
            const formattedContent = content.replace(/\n/g, '<br>');

            document.getElementById('newsDetailBody').innerHTML = `
                ${imageUrl ? `<img src="${imageUrl}" class="news-detail-image" alt="${title}">` : ''}
                ${category ? `<span class="news-category-badge">${category}</span>` : ''}
                <h1 class="news-detail-title">${title}</h1>
                <div class="news-meta">
                    <span>${formattedDate}</span>
                    ${author ? `<span>${author}</span>` : ''}
                </div>
                <div class="news-detail-text">${formattedContent}</div>
            `;

            document.getElementById('newsDetail').style.display = 'flex';
            document.body.style.overflow = 'hidden';
            window.scrollTo(0, 0);

            if (typeof gtag === 'function') {
                gtag('event', 'news_detail_view', { news_title: item.title });
            }
        }

        function closeNewsDetail() {
            document.getElementById('newsDetail').style.display = 'none';
            document.body.style.overflow = '';
            currentNewsItem = null;
        }

        async function shareNews() {
            if (!currentNewsItem) return;
            const shareData = {
                title: currentNewsItem.title,
                text: currentNewsItem.title + ' - Doğancı Köyü Platformu',
                url: window.location.href
            };

            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                    if (typeof gtag === 'function') {
                        gtag('event', 'news_share', { news_title: currentNewsItem.title, method: 'native' });
                    }
                } catch (err) {
                    if (err.name !== 'AbortError') copyToClipboard(shareData);
                }
            } else {
                copyToClipboard(shareData);
            }
        }

        function copyToClipboard(shareData) {
            const text = shareData.title + '\n' + shareData.url;
            navigator.clipboard.writeText(text).then(function() {
                var btn = document.querySelector('.news-share-btn');
                var orig = btn.innerHTML;
                btn.innerHTML = '&#10003; Kopyalandı!';
                setTimeout(function() { btn.innerHTML = orig; }, 2000);
            }).catch(function() {
                alert(shareData.title + '\n' + shareData.url);
            });
        }

        // ESC ile kapat
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeNewsDetail();
        });

        // Geri tuşu ile kapat (mobil)
        window.addEventListener('popstate', function() {
            if (document.getElementById('newsDetail').style.display === 'flex') {
                closeNewsDetail();
            }
        });
    </script>
    <script src="js/pwa-install.js"></script>
    <script src="js/push-manager.js"></script>
</body>
</html>
