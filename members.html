<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Üyeler - Doğancı İş İnsanları</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="icons/favicon.ico">
    <meta name="theme-color" content="#e05a00">
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-XXXXXXXXXX');
    </script>
</head>
<body>
    <a href="#main-content" class="skip-link">Ana içeriğe atla</a>

    <!-- Navbar -->
    <nav class="navbar" role="navigation" aria-label="Ana navigasyon">
        <div class="navbar-container">
            <a href="index.html" class="logo">
                <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <circle cx="50" cy="50" r="48" fill="#4E9FD1" stroke="#00CED1" stroke-width="3"/>
                    <path d="M30 60 L50 30 L70 60 Z" fill="#8B4513"/>
                    <path d="M45 40 L50 30 L55 40 Z" fill="#fff"/>
                    <polygon points="35,65 38,55 41,65" fill="#228B22"/>
                    <polygon points="42,65 45,55 48,65" fill="#228B22"/>
                    <polygon points="52,65 55,55 58,65" fill="#228B22"/>
                    <polygon points="59,65 62,55 65,65" fill="#228B22"/>
                    <ellipse cx="50" cy="75" rx="35" ry="8" fill="#90EE90"/>
                    <circle cx="50" cy="50" r="46" stroke="#fff" stroke-width="1.5" fill="none"/>
                </svg>
                <span>Doğancı İş İnsanları</span>
            </a>
            <button class="hamburger" aria-label="Menüyü aç/kapa" aria-expanded="false" onclick="this.setAttribute('aria-expanded', this.getAttribute('aria-expanded')==='false');document.getElementById('navLinks').classList.toggle('open')">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="members.html" class="active">Üyeler</a></li>
                <li><a href="news.html">Haberler</a></li>
            </ul>
        </div>
    </nav>

    <main id="main-content">
        <div class="page-container">
            <h1 class="page-title">İş İnsanlarımız</h1>

            <div class="search-filter-container">
                <div class="search-box">
                    <label for="searchInput" class="sr-only">Üye ara</label>
                    <input type="text" id="searchInput" class="search-input" placeholder="İsim, meslek, hizmet ara... (örn: musluk tamir)">
                </div>
                <div class="filter-box">
                    <label for="sectorFilter" class="sr-only">Sektöre göre filtrele</label>
                    <select id="sectorFilter" class="filter-select">
                        <option value="">Tüm Sektörler</option>
                    </select>
                </div>
                <div class="filter-box">
                    <label for="professionFilter" class="sr-only">Mesleğe göre filtrele</label>
                    <select id="professionFilter" class="filter-select">
                        <option value="">Tüm Meslekler</option>
                    </select>
                </div>
                <div class="result-counter" aria-live="polite">
                    <span id="resultCount">0</span> kişi
                </div>
            </div>

            <div id="loading" class="loading" role="status">Yükleniyor...</div>

            <div id="noResults" class="no-results" style="display: none;" role="status">
                <p>Aradığınız kriterlere uygun üye bulunamadı.</p>
            </div>

            <div id="membersList" class="members-list" role="list" aria-label="Üye listesi"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <script src="js/supabase-config.js"></script>
    <script>
        // XSS korumasi - HTML karakterlerini temizle
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        let allMembers = [];

        async function loadMembers() {
            const loading = document.getElementById('loading');
            const noResults = document.getElementById('noResults');

            try {
                const { data: members, error } = await supabase
                    .from('members')
                    .select('*')
                    .order('name');

                if (error) throw error;

                allMembers = members || [];
                loading.style.display = 'none';

                if (allMembers.length === 0) {
                    noResults.style.display = 'block';
                    document.getElementById('resultCount').textContent = '0';
                    return;
                }

                // Sektör filtresi
                const sectors = [...new Set(allMembers.map(m => m.sector).filter(Boolean))].sort();
                const sectorFilter = document.getElementById('sectorFilter');
                sectors.forEach(sec => {
                    const option = document.createElement('option');
                    option.value = sec;
                    option.textContent = sec;
                    sectorFilter.appendChild(option);
                });

                // Meslek filtresi
                const professions = [...new Set(allMembers.map(m => m.profession).filter(Boolean))].sort();
                const professionFilter = document.getElementById('professionFilter');
                professions.forEach(prof => {
                    const option = document.createElement('option');
                    option.value = prof;
                    option.textContent = prof;
                    professionFilter.appendChild(option);
                });

                displayMembers(allMembers);

            } catch (error) {
                console.error('Hata:', error);
                loading.textContent = 'Hata: ' + error.message;
            }
        }

        function displayMembers(members) {
            const list = document.getElementById('membersList');
            const noResults = document.getElementById('noResults');
            document.getElementById('resultCount').textContent = members.length;

            if (members.length === 0) {
                list.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }

            noResults.style.display = 'none';
            list.innerHTML = members.map(member => {
                const name = escapeHtml(member.name);
                const profession = escapeHtml(member.profession);
                const sector = escapeHtml(member.sector);
                const company = escapeHtml(member.company);
                const city = escapeHtml(member.city);
                const ilce = escapeHtml(member.ilce);
                const phone = escapeHtml(member.phone);
                const photoUrl = member.photo_url ? escapeHtml(member.photo_url) : '';
                const waPhone = phone ? phone.replace(/[\s\-\(\)\.]/g, '').replace(/^0/, '90').replace(/^\+/, '') : '';

                return `
                <div class="member-card" role="listitem">
                    ${photoUrl
                        ? `<img src="${photoUrl}" class="member-photo" alt="${name}" loading="lazy" onerror="this.style.display='none'">`
                        : `<div class="member-photo-placeholder" aria-hidden="true">&#128100;</div>`}
                    <div class="member-info">
                        <div class="member-name">${name}</div>
                        ${profession ? `<div class="member-profession">${profession}</div>` : ''}
                        ${sector ? `<div class="member-detail">${sector}</div>` : ''}
                        ${company ? `<div class="member-detail">${company}</div>` : ''}
                        ${(city || ilce) ? `<div class="member-detail">${[ilce, city].filter(Boolean).join(' / ')}</div>` : ''}
                        ${phone ? `<div class="member-actions">
                            <a href="tel:${phone}" class="phone-link" aria-label="${name} kişisini ara" onclick="typeof gtag==='function'&&gtag('event','member_call_click',{member_name:'${name}'})">Ara</a>
                            <a href="https://wa.me/${waPhone}" target="_blank" rel="noopener noreferrer" class="whatsapp-link" aria-label="${name} kişisine WhatsApp mesajı gönder" onclick="typeof gtag==='function'&&gtag('event','member_whatsapp_click',{member_name:'${name}'})"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>WhatsApp</a>
                        </div>` : ''}
                    </div>
                </div>`;
            }).join('');
        }

        function filterMembers() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const professionFilter = document.getElementById('professionFilter').value;
            const sectorFilter = document.getElementById('sectorFilter').value;
            let filtered = allMembers;

            if (searchTerm) {
                filtered = filtered.filter(m =>
                    m.name.toLowerCase().includes(searchTerm) ||
                    (m.profession && m.profession.toLowerCase().includes(searchTerm)) ||
                    (m.sector && m.sector.toLowerCase().includes(searchTerm)) ||
                    (m.company && m.company.toLowerCase().includes(searchTerm)) ||
                    (m.city && m.city.toLowerCase().includes(searchTerm)) ||
                    (m.ilce && m.ilce.toLowerCase().includes(searchTerm)) ||
                    (m.keywords && m.keywords.toLowerCase().includes(searchTerm))
                );
            }

            if (sectorFilter) {
                filtered = filtered.filter(m => m.sector === sectorFilter);
            }

            if (professionFilter) {
                filtered = filtered.filter(m => m.profession === professionFilter);
            }

            displayMembers(filtered);

            // GA4 arama olayı (debounce)
            if (searchTerm && typeof gtag === 'function') {
                clearTimeout(window._gaSearchTimeout);
                window._gaSearchTimeout = setTimeout(function() {
                    gtag('event', 'member_search', {
                        search_term: searchTerm,
                        results_count: filtered.length
                    });
                }, 1000);
            }
        }

        document.getElementById('searchInput').addEventListener('input', filterMembers);
        document.getElementById('sectorFilter').addEventListener('change', filterMembers);
        document.getElementById('professionFilter').addEventListener('change', filterMembers);
        window.addEventListener('load', loadMembers);
    </script>
    <script src="js/pwa-install.js"></script>
    <script src="js/push-manager.js"></script>
</body>
</html>
